<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanh AI Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar bên trái */
        .sidebar {
            width: 260px;
            background-color: #1e1f20;
            display: flex;
            flex-direction: column;
            padding: 12px;
            border-right: 1px solid #2f3033;
        }

        .new-chat-btn {
            background-color: #28292c;
            color: #e3e3e3;
            border: none;
            padding: 10px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #3b3c40;
        }

        .sidebar-title {
            font-size: 12px;
            color: #8e918f;
            margin-bottom: 8px;
            padding-left: 8px;
            font-weight: 500;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .history-item {
            padding: 10px 12px;
            font-size: 13px;
            color: #c4c7c5;
            border-radius: 16px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: #28292c;
            color: #e3e3e3;
        }

        .user-panel {
            padding-top: 10px;
            border-top: 1px solid #2f3033;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            font-size: 14px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #a8c7fa;
            color: #001d35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .logout-btn {
            background-color: transparent;
            color: #f2b8b5;
            border: 1px solid #8c504e;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: #411e1d;
        }

        /* Khung chat chính bên phải */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        .top-bar {
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 500;
            color: #e3e3e3;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Phần chữ mở đầu lấp lánh (nitro) */
        .welcome-msg {
            margin-top: 20vh;
            font-size: 36px;
            font-weight: 600;
            background: linear-gradient(to right, #9bbbf0, #c48b9f, #f2b8b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .chat-messages {
            width: 100%;
            max-width: 750px;
            display: none;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .msg.user {
            background-color: #2b2c2f;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            background-color: transparent;
            color: #e3e3e3;
            align-self: flex-start;
            padding-left: 0;
        }

        /* Khung nhập tin nhắn */
        .input-area {
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: #131314;
        }

        .input-box {
            width: 100%;
            max-width: 750px;
            background-color: #1e1f20;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .input-box:focus-within {
            border-color: #444746;
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #e3e3e3;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 150px;
            padding: 8px 0;
        }

        .send-btn {
            background-color: #a8c7fa;
            color: #001d35;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="startNewChat()">+ Cuộc trò chuyện mới</button>
        <div class="sidebar-title">Gần đây</div>
        <div class="history-list" id="history-list">
            <!-- Lịch sử chat sẽ load ở đây -->
        </div>
        <div class="user-panel">
            <div class="user-info">
                <div class="avatar">T</div>
                <span>Trần Việt Anh</span>
            </div>
            <button class="logout-btn">Đăng xuất</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">Vanh AI Desktop</div>
        
        <div class="chat-container" id="chat-container">
            <!-- Dòng chữ nitro chào mừng đã quay trở lại -->
            <div class="welcome-msg" id="welcome-msg">Chào Việt Anh, bạn đang nghĩ gì...</div>
            <div class="chat-messages" id="chat-messages">
                <!-- Nội dung tin nhắn chat -->
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <textarea id="user-input" placeholder="Bạn đang nghĩ gì..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">&#8593;</button>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyD... (Điền API Key của Vanh vào đây)"; // Thay Key của Vanh vào đây
        let isFirstMessage = true;

        function getHistoryKey() {
            return 'vanh_ai_history_list_' + (localStorage.getItem('vanh_ai_current_user') || 'default');
        }

        function startNewChat() {
            document.getElementById('welcome-msg').style.display = 'block';
            const chatMsgs = document.getElementById('chat-messages');
            chatMsgs.style.display = 'none';
            chatMsgs.innerHTML = '';
            isFirstMessage = true;
        }

        function saveCurrentChat(title, messagesHtml) {
            let historyKey = getHistoryKey();
            let savedHistory = JSON.parse(localStorage.getItem(historyKey)) || [];
            
            let existingIndex = savedHistory.findIndex(item => item.title === title);
            if (existingIndex > -1) {
                savedHistory[existingIndex].content = messagesHtml;
            } else {
                savedHistory.unshift({ title: title, content: messagesHtml });
                if (savedHistory.length > 20) savedHistory.pop();
            }
            localStorage.setItem(historyKey, JSON.stringify(savedHistory));
            loadHistory();
        }

        function loadHistory() {
            const historyList = document.getElementById('history-list');
            let savedHistory = JSON.parse(localStorage.getItem(getHistoryKey())) || [];
            let itemsHtml = '';
            
            savedHistory.forEach((item) => {
                let safeTitle = item.title.replace(/'/g, "\\'");
                itemsHtml += `<div class="history-item" onclick="loadChatSession('${safeTitle}')">${item.title}</div>`;
            });
            historyList.innerHTML = itemsHtml;
        }

        function loadChatSession(title) {
            let savedHistory = JSON.parse(localStorage.getItem(getHistoryKey())) || [];
            let session = savedHistory.find(item => item.title === title);
            
            if (session) {
                document.getElementById('welcome-msg').style.display = 'none';
                const chatMsgs = document.getElementById('chat-messages');
                chatMsgs.style.display = 'flex';
                chatMsgs.innerHTML = session.content;
                chatMsgs.scrollTop = chatMsgs.scrollHeight;
                isFirstMessage = false;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputElem = document.getElementById('user-input');
            const text = inputElem.value.trim();
            if (!text) return;

            if (isFirstMessage) {
                document.getElementById('welcome-msg').style.display = 'none';
                document.getElementById('chat-messages').style.display = 'flex';
                isFirstMessage = false;
            }

            const chatMsgs = document.getElementById('chat-messages');
            chatMsgs.innerHTML += `<div class="msg user">${text}</div>`;
            inputElem.value = '';
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatMsgs.innerHTML += `<div class="msg ai" id="${loadingId}">Đang suy nghĩ...</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            try {
                // Đã cập nhật chuẩn model mới nhất: gemini-3.6-flash
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();

                let aiReply = "Xin lỗi, đã có lỗi xảy ra từ phản hồi của API.";
                if (data.candidates && data.candidates[0].content) {
                    aiReply = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiReply = "Lỗi từ Google API: " + data.error.message;
                }

                chatMsgs.innerHTML += `<div class="msg ai">${aiReply.replace(/\n/g, '<br>')}</div>`;
                chatMsgs.scrollTop = chatMsgs.scrollHeight;

                let firstUserMsg = chatMsgs.querySelector('.msg.user');
                if (firstUserMsg) {
                    saveCurrentChat(firstUserMsg.innerText, chatMsgs.innerHTML);
                }

            } catch (error) {
                const loadingElem = document.getElementById(loadingId);
                if (loadingElem) loadingElem.remove();
                chatMsgs.innerHTML += `<div class="msg ai">Lỗi kết nối mạng hoặc API Key không hợp lệ.</div>`;
            }
        }

        window.onload = function() {
            loadHistory();
        };
    </script>
</body>
</html>
