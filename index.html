<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanh AI Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Thư viện Marked.js để dịch Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Thư viện KaTeX để render công thức toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <style>
        :root {
            --bg-dark: #0f1117;
            --sidebar-bg: rgba(22, 27, 34, 0.45);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent: #3b82f6;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(15, 17, 23, 0.65), rgba(15, 17, 23, 0.65)), 
                        url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- MÀN HÌNH INTRO --- */
        #intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f1117;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: hideIntroScreen 0.1s ease 3.2s forwards;
        }

        @keyframes hideIntroScreen {
            to { display: none; visibility: hidden; opacity: 0; pointer-events: none; }
        }

        .intro-title {
            position: absolute;
            font-size: 3.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            animation: textNitroAnim 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes textNitroAnim {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            30% { opacity: 1; transform: scale(1); filter: blur(0); }
            70% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.1); filter: blur(10px); }
        }

        .intro-dot {
            position: absolute;
            width: 14px; height: 14px;
            background: #3b82f6;
            border-radius: 50%;
            top: -30px;
            opacity: 0;
            animation: nitroDropAndGlow 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
        }

        @keyframes nitroDropAndGlow {
            0% { top: -30px; opacity: 1; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            50% { top: calc(50% - 7px); opacity: 1; box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
            60% { top: calc(50% - 7px); opacity: 1; box-shadow: 0 0 100px 50px rgba(59, 130, 246, 0.7), 0 0 200px 100px rgba(147, 51, 234, 0.5); transform: scale(1.5); }
            100% { top: calc(50% - 7px); opacity: 0; box-shadow: 0 0 300px 200px rgba(59, 130, 246, 0); transform: scale(4); }
        }

        /* --- MÀN HÌNH ĐĂNG NHẬP --- */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            animation: fadeInAuth 0.5s ease 3.2s forwards;
        }

        @keyframes fadeInAuth { to { opacity: 1; } }

        .auth-box {
            background: rgba(30, 37, 48, 0.85);
            backdrop-filter: blur(16px);
            padding: 35px 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .auth-box h2 { margin-bottom: 6px; font-size: 1.5rem; color: white; text-align: center; }
        .auth-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; text-align: center; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            background: rgba(21, 26, 33, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }

        .auth-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .auth-btn:hover { background: #2563eb; }

        .google-btn {
            width: 100%;
            background: #fff;
            color: #1f1f1f;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 11px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .google-btn:hover { background: #f3f4f6; }
        .google-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .switch-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 20px;
        }
        .switch-text span { color: var(--accent); cursor: pointer; font-weight: 500; }

        /* --- GIAO DIỆN CHÍNH --- */
        .app-container { display: flex; width: 100%; height: 100%; }

        sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .new-chat-btn {
            background: rgba(33, 38, 45, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            backdrop-filter: blur(8px);
        }
        .new-chat-btn:hover { background: rgba(48, 54, 61, 0.6); }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 10px 0 4px 4px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #c9d1d9;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .history-item:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-color: var(--border-color);
        }

        .user-profile-box {
            background: rgba(30, 37, 48, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }
        .user-info-row { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 0.85rem; color: white;
        }
        .user-name { font-size: 0.9rem; font-weight: 500; color: white; }
        
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
        }
        .logout-btn:hover { background: #ef4444; color: white; }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
        }

        .chat-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .welcome-text {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: center;
            color: #e6edf3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes drawBoxNitro {
            0% { width: 0px; height: 0px; border-color: transparent; opacity: 0; }
            50% { width: 100%; height: 0px; border-color: var(--accent); opacity: 1; }
            100% {
                width: 100%;
                min-height: 54px;
                border-color: var(--border-color);
                background: rgba(20, 24, 33, 0.75);
                opacity: 1;
                box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            }
        }

        .draw-input-box {
            width: 100%;
            max-width: 680px;
            min-height: 54px;
            border: 1px solid var(--border-color);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            gap: 8px;
            position: relative;
            animation: drawBoxNitro 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            backdrop-filter: blur(16px);
        }

        .input-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        .draw-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 0.95rem;
            outline: none;
            opacity: 0;
            animation: fadeInText 0.5s 0.6s forwards;
        }

        @keyframes fadeInText { to { opacity: 1; } }

        .attach-btn {
            background: rgba(33, 38, 45, 0.8);
            color: var(--text-muted);
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.2s;
            opacity: 0;
            animation: fadeInText 0.5s 0.7s forwards;
        }
        .attach-btn:hover { background: rgba(48, 54, 61, 0.9); color: white; border-color: var(--accent); }

        .send-icon {
            background: var(--accent);
            color: white;
            width: 34px; height: 34px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            opacity: 0;
            animation: fadeInText 0.5s 0.7s forwards;
        }
        .send-icon:hover { transform: scale(1.1); background: #2563eb; }

        #image-preview-container {
            display: none;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
        }
        .preview-thumb-wrapper {
            position: relative;
            width: 50px; height: 50px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .preview-thumb-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .remove-preview-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 16px; height: 16px;
            font-size: 10px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        #chat-messages {
            width: 100%;
            max-width: 750px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            display: none;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
        }
        .msg.user { background: rgba(43, 49, 59, 0.85); align-self: flex-end; border: 1px solid var(--border-color); }
        .msg.ai { background: rgba(31, 36, 45, 0.85); border: 1px solid var(--border-color); align-self: flex-start; }
        .msg.ai p { margin-bottom: 8px; }
        .msg.ai ul, .msg.ai ol { margin-left: 20px; margin-bottom: 8px; }

        .msg-image {
            max-width: 250px;
            max-height: 250px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Màn hình Intro Nitro Animation -->
    <div id="intro-screen">
        <div class="intro-title">Vanh AI Dev</div>
        <div class="intro-dot"></div>
    </div>

    <!-- Màn hình Đăng nhập -->
    <div id="auth-screen" style="display: none;">
        <div class="auth-box">
            <div id="login-form">
                <h2>Đăng nhập</h2>
                <p>Kết nối SheetDB Database</p>
                <div class="form-group">
                    <label>Tài khoản</label>
                    <input type="text" id="login-username" placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="auth-btn" onclick="handleLogin()">Đăng nhập</button>
                <button class="google-btn" onclick="handleGoogleLogin()" type="button">
                    <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.19z"/>
                        <path fill="#34A853" d="M12 21.83c2.63 0 4.84-.87 6.45-2.41l-3.14-2.43c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.51A9.74 9.74 0 0 0 12 21.83z"/>
                        <path fill="#FBBC05" d="M6.54 13.89A5.86 5.86 0 0 1 6.23 12c0-.66.11-1.3.31-1.89V7.6H3.3A9.77 9.77 0 0 0 2.25 12c0 1.58.38 3.08 1.05 4.4l3.24-2.51z"/>
                        <path fill="#EA4335" d="M12 6.08c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.15 14.63 2.17 12 2.17A9.74 9.74 0 0 0 3.3 7.6l3.24 2.51C7.31 7.8 9.46 6.08 12 6.08z"/>
                    </svg>
                    Đăng nhập bằng Google
                </button>
                <div class="switch-text">Chưa có tài khoản? <span onclick="switchTab('register')">Đăng ký ngay</span></div>
            </div>

            <div id="register-form" style="display: none;">
                <h2>Đăng ký</h2>
                <p>Tạo tài khoản lưu lên Sheet</p>
                <div class="form-group">
                    <label>Tên hiển thị / Tài khoản</label>
                    <input type="text" id="reg-name" placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="reg-password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="auth-btn" onclick="handleRegister()">Đăng ký</button>
                <div class="switch-text">Đã có tài khoản? <span onclick="switchTab('login')">Đăng nhập</span></div>
            </div>
        </div>
    </div>

    <!-- Giao diện chính -->
    <div class="app-container" id="app-main" style="display: none;">
        <sidebar>
            <div class="sidebar-header">⚡ Vanh AI Desktop</div>
            <button class="new-chat-btn" onclick="startNewChat()">+ Cuộc trò chuyện mới</button>
            <div class="history-section" id="history-list">
                <div class="history-title">Gần đây</div>
            </div>
            <div class="user-profile-box">
                <div class="user-info-row">
                    <div class="user-avatar" id="user-avatar-initial">V</div>
                    <div class="user-name" id="user-display-name">User</div>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Đăng xuất</button>
            </div>
        </sidebar>

        <div class="main-chat">
            <div class="chat-body">
                <div class="welcome-text" id="welcome-msg">Chào Vanh AI, tiếp theo mình làm gì?</div>
                <div id="chat-messages"></div>
                
                <div class="draw-input-box" id="chatInputBox">
                    <div id="image-preview-container">
                        <div class="preview-thumb-wrapper">
                            <img id="preview-img-tag" src="" alt="Preview">
                            <button class="remove-preview-btn" onclick="clearAttachedImage()">✕</button>
                        </div>
                    </div>
                    <div class="input-row">
                        <input type="file" id="imageInputFile" accept="image/*" style="display: none;" onchange="handleFileSelected(event)">
                        <button class="attach-btn" title="Đính kèm ảnh" onclick="document.getElementById('imageInputFile').click()">+</button>
                        
                        <input type="text" id="userInput" placeholder="Bạn đang nghĩ gì hoặc dán ảnh (Ctrl+V)..." onkeydown="if(event.key==='Enter') sendMessage()" onpaste="handlePasteImage(event)">
                        <button class="send-icon" onclick="sendMessage()">➔</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.run/@google/genai";

        const p1 = "AQ.Ab8RN6IY-oy0TJ";
        const p2 = "8e8r2fwLSI-TsbKX8HaIYvru_cvhg-N38Yvg";
        const GEMINI_API_KEY = p1 + p2;
        const SHEETDB_API = "https://sheetdb.io/api/v1/67pirhj3ffh1w"; 
        
        const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });
        let currentAttachedImage = null;

        function getHistoryKey() {
            return 'vanh_ai_history_data_' + (localStorage.getItem('vanh_ai_current_user') || 'default');
        }

        let currentChatSessions = JSON.parse(localStorage.getItem(getHistoryKey())) || [];
        let activeSessionId = null;

        window.onload = function() {
            const currentUser = localStorage.getItem('vanh_ai_current_user');
            if (currentUser) {
                setTimeout(() => { openApp(currentUser); }, 3200);
            } else {
                setTimeout(() => { document.getElementById('auth-screen').style.display = 'flex'; }, 3200);
            }
        };

        window.switchTab = function(tab) {
            if (tab === 'register') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            } else {
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            }
        };

        // Đăng nhập Google cần cấu hình OAuth Client ID/Google Identity Services.
        window.handleGoogleLogin = function() {
            alert('Nút Google đã được thêm. Để đăng nhập Google thật, cần cấu hình Google OAuth Client ID cho website này.');
        };

        window.handleRegister = async function() {
            const name = document.getElementById('reg-name').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            if (!name || !pass) { alert('Vui lòng điền đầy đủ!'); return; }

            try {
                const checkRes = await fetch(`${SHEETDB_API}/search?username=${encodeURIComponent(name)}`);
                const existing = await checkRes.json();
                if (existing.length > 0) {
                    alert('Tài khoản này đã tồn tại trên hệ thống!');
                    return;
                }

                const response = await fetch(SHEETDB_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: { username: name, password: pass } })
                });

                if (response.ok) {
                    alert('Đăng ký thành công!');
                    switchTab('login');
                } else {
                    throw new Error('Lỗi từ SheetDB');
                }
            } catch (err) {
                alert('Đăng ký thất bại, vui lòng kiểm tra lại kết nối!');
            }
        };

        window.handleLogin = async function() {
            const name = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            if (!name || !pass) { alert('Vui lòng điền đầy đủ!'); return; }

            try {
                const response = await fetch(`${SHEETDB_API}/search?username=${encodeURIComponent(name)}&password=${encodeURIComponent(pass)}`);
                const users = await response.json();

                if (users.length > 0) {
                    localStorage.setItem('vanh_ai_current_user', name);
                    openApp(name);
                } else {
                    alert('Sai tài khoản hoặc mật khẩu!');
                }
            } catch (err) {
                alert('Không thể kết nối đến cơ sở dữ liệu!');
            }
        };

        function openApp(username) {
            document.getElementById('user-display-name').innerText = username;
            document.getElementById('user-avatar-initial').innerText = username.charAt(0).toUpperCase();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-main').style.display = 'flex';
            currentChatSessions = JSON.parse(localStorage.getItem(getHistoryKey())) || [];
            loadHistory();
        }

        window.handleLogout = function() {
            localStorage.removeItem('vanh_ai_current_user');
            location.reload();
        };

        function loadHistory() {
            const historyList = document.getElementById('history-list');
            let itemsHtml = '<div class="history-title">Gần đây</div>';
            
            currentChatSessions.forEach((session, index) => {
                itemsHtml += `<div class="history-item" onclick="loadSession(${index})">${escapeHtml(session.title)}</div>`;
            });
            historyList.innerHTML = itemsHtml;
        }

        window.startNewChat = function() {
            activeSessionId = null;
            clearAttachedImage();
            document.getElementById('chat-messages').style.display = 'none';
            document.getElementById('welcome-msg').style.display = 'block';
            document.getElementById('chat-messages').innerHTML = '';
        };

        window.loadSession = function(index) {
            activeSessionId = index;
            const session = currentChatSessions[index];
            const chatMsgs = document.getElementById('chat-messages');
            
            chatMsgs.innerHTML = '';
            document.getElementById('welcome-msg').style.display = 'none';
            chatMsgs.style.display = 'flex';

            session.messages.forEach(msg => {
                let contentHtml = '';
                if (msg.image) {
                    contentHtml += `<img src="${msg.image}" class="msg-image">`;
                }
                if (msg.text) {
                    if (msg.sender === 'user') {
                        contentHtml += escapeHtml(msg.text);
                    } else {
                        contentHtml += marked.parse(msg.text);
                    }
                }
                chatMsgs.innerHTML += `<div class="msg ${msg.sender}">${contentHtml}</div>`;
            });

            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            if (window.renderMathInElement) {
                renderMathInElement(chatMsgs, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        };

        function saveMessageToCurrentSession(userText, aiText, imageBase64) {
            if (activeSessionId === null) {
                const titleText = userText ? userText : "[Hình ảnh]";
                const newSession = {
                    title: titleText.length > 25 ? titleText.substring(0, 25) + '...' : titleText,
                    messages: [
                        { sender: 'user', text: userText, image: imageBase64 },
                        { sender: 'ai', text: aiText }
                    ]
                };
                currentChatSessions.unshift(newSession);
                activeSessionId = 0;
            } else {
                currentChatSessions[activeSessionId].messages.push({ sender: 'user', text: userText, image: imageBase64 });
                currentChatSessions[activeSessionId].messages.push({ sender: 'ai', text: aiText });
            }

            if (currentChatSessions.length > 20) currentChatSessions.pop();
            localStorage.setItem(getHistoryKey(), JSON.stringify(currentChatSessions));
            loadHistory();
        }

        window.handleFileSelected = function(event) {
            const file = event.target.files[0];
            if (file) {
                processImageFile(file);
            }
        }

        window.handlePasteImage = function(event) {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    if (file) {
                        processImageFile(file);
                        event.preventDefault();
                    }
                }
            }
        }

        function processImageFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentAttachedImage = e.target.result;
                document.getElementById('preview-img-tag').src = currentAttachedImage;
                document.getElementById('image-preview-container').style.display = 'flex';
            }
            reader.readAsDataURL(file);
        }

        window.clearAttachedImage = function() {
            currentAttachedImage = null;
            document.getElementById('image-preview-container').style.display = 'none';
            document.getElementById('preview-img-tag').src = '';
            document.getElementById('imageInputFile').value = '';
        }

        window.sendMessage = async function() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            const attachedImg = currentAttachedImage;

            if (!text && !attachedImg) return;

            document.getElementById('welcome-msg').style.display = 'none';
            const chatMsgs = document.getElementById('chat-messages');
            chatMsgs.style.display = 'flex';

            let userMsgHtml = `<div class="msg user">`;
            if (attachedImg) {
                userMsgHtml += `<img src="${attachedImg}" class="msg-image">`;
            }
            if (text) {
                userMsgHtml += `<div>${escapeHtml(text)}</div>`;
            }
            userMsgHtml += `</div>`;

            chatMsgs.innerHTML += userMsgHtml;
            inputField.value = '';
            clearAttachedImage();
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatMsgs.innerHTML += `<div class="msg ai" id="${loadingId}" style="color: var(--text-muted); font-style: italic;">Đang trả lời...</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            let aiReply = "";
            try {
                let contentsParam = [];
                if (attachedImg) {
                    const base64Data = attachedImg.split(',')[1];
                    const mimeType = attachedImg.substring(attachedImg.indexOf(':') + 1, attachedImg.indexOf(';'));
                    
                    contentsParam = [
                        { inlineData: { data: base64Data, mimeType: mimeType } },
                        text ? text : "Hãy mô tả hoặc phân tích hình ảnh này giúp tôi."
                    ];
                } else {
                    contentsParam = text;
                }

                const response = await ai.models.generateContent({
                    model: 'gemini-3.6-flash',
                    contents: contentsParam,
                });
                aiReply = response.text || "Không nhận được phản hồi.";
            } catch (err) {
                aiReply = "Lỗi kết nối API: " + err.message;
            }

            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();

            const formattedHtml = marked.parse(aiReply);
            chatMsgs.innerHTML += `<div class="msg ai">${formattedHtml}</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            saveMessageToCurrentSession(text, aiReply, attachedImg);

            if (window.renderMathInElement) {
                renderMathInElement(chatMsgs, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }
        };

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
