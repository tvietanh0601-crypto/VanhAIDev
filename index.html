<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanh AI Dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-deep: #060709;
            --sidebar-bg: rgba(14, 17, 23, 0.5);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent: #a855f7; /* Tím phong cách Nitro */
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --user-bubble-border: rgba(59, 130, 246, 0.6);
            --ai-bubble-border: rgba(168, 85, 247, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- NITRO SPLASH SCREEN ANIMATION --- */
        #nitro-splash {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #040507; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            gap: 16px;
        }
        .splash-logo {
            font-size: 2.8rem; font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #a855f7, #3b82f6);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: nitroPulse 1.4s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes nitroPulse {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.3)); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.7)); }
        }
        .splash-sub { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 3px; text-transform: uppercase; }

        /* --- AUTH MODAL --- */
        #auth-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(4, 5, 7, 0.85); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 9998;
        }
        .auth-box {
            width: 100%; max-width: 400px; padding: 30px; border-radius: 20px;
            background: rgba(14, 17, 23, 0.7); border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3); display: flex; flex-direction: column; gap: 16px;
        }
        .auth-box h2 { text-align: center; color: #fff; font-size: 1.5rem; }
        .auth-box input {
            width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05); color: #fff; outline: none; font-size: 0.95rem;
        }
        .auth-box input:focus { border-color: var(--accent); }
        .auth-btn {
            width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
            background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; font-weight: 600; font-size: 1rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        .auth-btn:hover { opacity: 0.9; }

        .app-container { display: flex; width: 100%; height: 100%; }

        /* --- SIDEBAR --- */
        sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            z-index: 10;
        }

        .sidebar-header {
            font-weight: 600;
            font-size: 1.05rem;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-status { font-size: 0.75rem; background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent); padding: 3px 8px; border-radius: 10px; color: #d8b4fe; }

        .new-chat-btn {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .new-chat-btn:hover { 
            background: rgba(168, 85, 247, 0.3);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .history-section {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 12px 0 6px 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            color: #c9d1d9;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.06); border-color: var(--border-color); }
        .history-item.active { background: rgba(168, 85, 247, 0.2); border-color: var(--accent); }

        /* --- CHAT MAIN --- */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: transparent; position: relative; }
        .chat-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px; overflow: hidden; }

        .welcome-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; gap: 16px;
        }
        .welcome-text {
            font-size: 2.2rem; font-weight: 600;
            background: linear-gradient(135deg, #60a5fa, #a855f7, #f43f5e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome-sub { color: var(--text-muted); font-size: 1rem; max-width: 500px; }

        #chat-messages {
            width: 100%; max-width: 800px; flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 20px; padding: 20px 10px; display: none;
        }

        /* --- CỤC CHAT TRONG SUỐT HOÀN TOÀN, CHỈ CÓ VIỀN PHÁT SÁNG --- */
        .msg {
            padding: 14px 18px; border-radius: 16px; max-width: 82%;
            line-height: 1.6; font-size: 0.95rem;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.02) !important;
            position: relative;
        }

        .msg.user { 
            align-self: flex-end; 
            border: 1px solid var(--user-bubble-border) !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25), inset 0 0 10px rgba(59, 130, 246, 0.1);
            color: #e2e8f0;
        }

        .msg.ai { 
            align-self: flex-start; 
            border: 1px solid var(--ai-bubble-border) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.25), inset 0 0 10px rgba(168, 85, 247, 0.1);
            color: #f8fafc;
        }

        .msg.ai p { margin-bottom: 10px; }
        .msg.ai pre { background: rgba(0, 0, 0, 0.5); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin: 10px 0; }
        .msg-image { max-width: 240px; border-radius: 10px; margin-bottom: 8px; display: block; border: 1px solid var(--border-color); }

        /* --- KHUNG NHẬP LIỆU TRONG SUỐT, VIỀN PHÁT SÁNG --- */
        .input-wrapper { width: 100%; display: flex; justify-content: center; padding-bottom: 10px; }

        .draw-input-box {
            width: 100%; max-width: 750px; min-height: 58px; border-radius: 28px;
            display: flex; flex-direction: column; padding: 10px 18px; gap: 8px; position: relative;
            border: 1px solid rgba(168, 85, 247, 0.6);
            background: rgba(15, 17, 23, 0.25);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2), inset 0 0 12px rgba(168, 85, 247, 0.08);
            backdrop-filter: blur(14px);
        }

        .input-row { display: flex; align-items: center; width: 100%; gap: 12px; }

        .draw-input-box textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-main); font-size: 0.98rem; resize: none; max-height: 120px; line-height: 1.5;
        }

        .send-btn {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            color: white; width: 38px; height: 38px; border-radius: 50%;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.06); }
        .send-btn svg { width: 16px; height: 16px; fill: white; }

        #image-preview-container { display: none; align-items: center; gap: 8px; padding-left: 4px; }
        .preview-thumb-wrapper { position: relative; width: 48px; height: 48px; border-radius: 8px; overflow: hidden; border: 1px solid var(--accent); }
        .preview-thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .remove-preview-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.8); color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2>⚡ Đăng nhập Vanh AI</h2>
            <input type="text" id="authUsername" placeholder="Nhập tên tài khoản của bạn...">
            <button class="auth-btn" onclick="handleAuth()">Bắt đầu sử dụng</button>
        </div>
    </div>

    <!-- MÀN HÌNH CHỜ NITRO INTRO ANIMATION -->
    <div id="nitro-splash">
        <div class="splash-logo">⚡ Vanh AI Dev</div>
        <div class="splash-sub">Khởi động hệ thống tuyệt đỉnh...</div>
    </div>

    <div class="app-container">
        <sidebar>
            <div class="sidebar-header">
                <span>⚡ Vanh AI</span>
                <span class="user-status" id="displayUsername">Nitro Pro</span>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">+ Cuộc trò chuyện mới</button>
            <div class="history-section" id="history-list">
                <div class="history-title">Gần đây</div>
            </div>
        </sidebar>

        <div class="main-chat">
            <div class="chat-body">
                <div class="welcome-container" id="welcomeContainer">
                    <div class="welcome-text" id="welcomeUserText">Xin chào Trần Việt Anh!</div>
                    <div class="welcome-sub">Hệ thống mở đầu Nitro đã sẵn sàng. Bạn muốn trò chuyện gì với Diễm My hôm nay?</div>
                </div>

                <div id="chat-messages"></div>

                <div class="input-wrapper">
                    <div class="draw-input-box">
                        <div id="image-preview-container">
                            <div class="preview-thumb-wrapper">
                                <img id="preview-img-tag" src="" alt="Preview">
                                <button class="remove-preview-btn" onclick="clearAttachedImage()">✕</button>
                            </div>
                        </div>
                        <div class="input-row">
                            <input type="file" id="imageInputFile" accept="image/*" style="display: none;" onchange="processFile(event.target.files[0])">
                            <button class="attach-btn" title="Đính kèm ảnh" onclick="document.getElementById('imageInputFile').click()" style="background:none;border:none;color:var(--text-muted);font-size:1.2rem;cursor:pointer;">+</button>
                            <textarea id="userInput" placeholder="Nhắn gì đó cho AI (Năm hiện tại: 2026)..." rows="1" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                            <button class="send-btn" onclick="sendMessage()">
                                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra thông tin đăng nhập từ LocalStorage
        let currentUser = localStorage.getItem('nitro_ai_user');
        window.addEventListener('load', () => {
            if (currentUser) {
                document.getElementById('auth-modal').style.display = 'none';
                updateUserInterface(currentUser);
            }
            setTimeout(() => {
                const splash = document.getElementById('nitro-splash');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1500);
            loadHistory();
        });

        function handleAuth() {
            const usernameInput = document.getElementById('authUsername').value.trim();
            if (!usernameInput) return alert('Vui lòng nhập tên tài khoản!');
            currentUser = usernameInput;
            localStorage.setItem('nitro_ai_user', currentUser);
            document.getElementById('auth-modal').style.display = 'none';
            updateUserInterface(currentUser);
        }

        function updateUserInterface(name) {
            document.getElementById('displayUsername').innerText = name;
            document.getElementById('welcomeUserText').innerText = `Xin chào ${name}!`;
        }

        // OpenAI API Key & SheetDB Endpoint
        const OPENAI_API_KEY = "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";
        const SHEETDB_API_URL = "https://sheetdb.io/api/v1/YOUR_SHEETDB_ID"; // Thay bằng API URL của bạn từ SheetDB.io

        let currentAttachedImage = null;
        let sessions = JSON.parse(localStorage.getItem('nitro_ai_sessions')) || [];
        let activeId = null;

        function loadHistory() {
            const list = document.getElementById('history-list');
            let html = '<div class="history-title">Gần đây</div>';
            sessions.forEach((s, i) => {
                html += `<div class="history-item ${activeId === i ? 'active' : ''}" onclick="loadSession(${i})">${escapeHtml(s.title)}</div>`;
            });
            list.innerHTML = html;
        }

        window.startNewChat = function() {
            activeId = null;
            clearAttachedImage();
            document.getElementById('chat-messages').style.display = 'none';
            document.getElementById('welcomeContainer').style.display = 'flex';
            document.getElementById('chat-messages').innerHTML = '';
            loadHistory();
        }

        window.loadSession = function(i) {
            activeId = i;
            const chatMsgs = document.getElementById('chat-messages');
            chatMsgs.innerHTML = '';
            document.getElementById('welcomeContainer').style.display = 'none';
            chatMsgs.style.display = 'flex';

            sessions[i].messages.forEach(m => {
                let imgHtml = m.image ? `<img src="${m.image}" class="msg-image">` : '';
                let contentHtml = m.role === 'user' ? escapeHtml(m.content) : marked.parse(m.content);
                chatMsgs.innerHTML += `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${imgHtml}<div>${contentHtml}</div></div>`;
            });
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
            loadHistory();
        }

        function processFile(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                currentAttachedImage = e.target.result;
                document.getElementById('preview-img-tag').src = currentAttachedImage;
                document.getElementById('image-preview-container').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        window.clearAttachedImage = () => {
            currentAttachedImage = null;
            document.getElementById('image-preview-container').style.display = 'none';
            document.getElementById('imageInputFile').value = '';
        }

        // Hàm đồng bộ dữ liệu lên Google Sheets thông qua SheetDB
        async function syncToSheetDB(sessionTitle, userMsg, aiReply) {
            try {
                await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: {
                            User: currentUser || "Trần Việt Anh",
                            SessionTitle: sessionTitle,
                            UserMessage: userMsg,
                            AIReply: aiReply,
                            Timestamp: new Date().toISOString()
                        }
                    })
                });
            } catch (err) {
                console.error("Lỗi đồng bộ SheetDB:", err);
            }
        }

        window.sendMessage = async function() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            const img = currentAttachedImage;
            if (!text && !img) return;

            document.getElementById('welcomeContainer').style.display = 'none';
            const chatMsgs = document.getElementById('chat-messages');
            chatMsgs.style.display = 'flex';

            let uHtml = `<div class="msg user">`;
            if (img) uHtml += `<img src="${img}" class="msg-image">`;
            if (text) uHtml += `<div>${escapeHtml(text)}</div>`;
            uHtml += `</div>`;

            chatMsgs.innerHTML += uHtml;
            input.value = '';
            input.style.height = 'auto';
            clearAttachedImage();
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            const loadId = 'load-' + Date.now();
            chatMsgs.innerHTML += `<div class="msg ai" id="${loadId}" style="color: var(--text-muted)">Diễm My đang suy nghĩ...</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            let messagesPayload = [
                { role: "system", content: `Bạn là trợ lý AI thông minh, thân thiện tên là Diễm My của người dùng ${currentUser || 'Trần Việt Anh'}. Hôm nay là ngày 26 tháng 9 năm 2026.` }
            ];

            if (activeId !== null) {
                sessions[activeId].messages.forEach(m => {
                    messagesPayload.push({ role: m.role, content: m.content });
                });
            }
            messagesPayload.push({ role: "user", content: text });

            let reply = "";
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: messagesPayload
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                reply = data.choices[0].message.content;
            } catch (err) {
                reply = "Lỗi kết nối OpenAI API: " + err.message;
            }

            document.getElementById(loadId)?.remove();
            chatMsgs.innerHTML += `<div class="msg ai">${marked.parse(reply)}</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;

            let sessionTitle = text.substring(0, 30) || 'Đoạn chat mới';
            if (activeId === null) {
                sessions.unshift({ 
                    title: sessionTitle, 
                    messages: [
                        { role: 'user', content: text, image: img }, 
                        { role: 'assistant', content: reply }
                    ] 
                });
                activeId = 0;
            } else {
                sessionTitle = sessions[activeId].title;
                sessions[activeId].messages.push({ role: 'user', content: text, image: img });
                sessions[activeId].messages.push({ role: 'assistant', content: reply });
            }

            localStorage.setItem('nitro_ai_sessions', JSON.stringify(sessions));
            loadHistory();

            // Gửi dữ liệu ngầm lên Google Sheets qua SheetDB
            syncToSheetDB(sessionTitle, text, reply);
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
